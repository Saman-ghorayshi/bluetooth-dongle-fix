<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="guiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="primaryBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2EA043" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .win-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #FFFFFF; }
    .win-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8B949E; }
    .card-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #F0F6FC; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #F0F6FC; }
    .item-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #8B949E; }
    .tag-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10px; }
    .btn-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #F0F6FC; }
    .console-txt { font-family: "JetBrains Mono", Consolas, "Fira Code", monospace; font-size: 10.5px; fill: #C9D1D9; }
  </style>

  <!-- Window Frame -->
  <rect x="0" y="0" width="960" height="560" rx="12" fill="url(#windowBg)" stroke="#30363D" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="960" height="42" rx="12" fill="#161B22" />
  <rect x="0" y="30" width="960" height="12" fill="#161B22" />
  <line x1="0" y1="42" x2="960" y2="42" stroke="#30363D" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="21" r="6" fill="#F85149" />
  <circle cx="38" cy="21" r="6" fill="#FBBF24" />
  <circle cx="56" cy="21" r="6" fill="#2EA043" />
  <text x="80" y="25" class="win-title">Bluetooth Dongle Fix &amp; Superiority Benchmark</text>

  <!-- Header Section -->
  <g transform="translate(24, 60)">
    <text x="0" y="20" font-size="22" font-weight="800" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">🎧 Bluetooth Dongle Fix</text>
    <rect x="250" y="4" width="40" height="20" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="259" y="18" font-size="11" font-weight="700" fill="#8B949E" font-family="sans-serif">v2.0</text>
    <text x="0" y="38" class="win-sub">Dual-Radio Conflict Resolver &amp; Superiority Benchmark Engine</text>

    <!-- Admin Badge -->
    <rect x="750" y="6" width="160" height="28" rx="6" fill="#12261E" stroke="#238636" stroke-width="1" />
    <text x="764" y="24" class="tag-txt" fill="#3FB950">🛡️ Administrator (Full Control)</text>
  </g>

  <!-- Diagnosis Banner -->
  <g transform="translate(24, 116)">
    <rect x="0" y="0" width="912" height="46" rx="8" fill="#361214" stroke="#F85149" stroke-width="1" />
    <text x="14" y="29" font-size="20">🔴</text>
    <text x="44" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="13px" fill="#F85149">CRITICAL: Dual-Radio Conflict Detected</text>
    <text x="44" y="36" class="win-sub" fill="#FCA5A5">Windows is locking the motherboard adapter and blocking your USB dongle with Code 31. Click Auto-Fix to isolate and activate the superior radio.</text>
  </g>

  <!-- Body Content: Radios & Peripherals Cards -->
  <g transform="translate(24, 174)">
    <!-- Column 1: Discovered Host Radios -->
    <rect x="0" y="0" width="530" height="210" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="16" y="24" class="card-hdr">📡 Bluetooth Host Radios</text>
    <text x="460" y="24" class="win-sub">2 detected</text>

    <!-- Radio Card 1: Dongle (Superior) -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="502" height="74" rx="6" fill="#21262D" stroke="#2EA043" stroke-width="1.5" />
      <text x="12" y="20" class="item-title">Generic Bluetooth Radio (CSR8510 A10)</text>
      <text x="12" y="34" class="item-sub">USB\VID_0A12&amp;PID_0001\5&amp;5E7D000&amp;0&amp;3 (Port_#0003)</text>
      
      <!-- Tags -->
      <rect x="12" y="44" width="125" height="20" rx="4" fill="#1F2D3D" />
      <text x="18" y="58" class="tag-txt" fill="#58A6FF">External USB Dongle</text>

      <rect x="143" y="44" width="135" height="20" rx="4" fill="#261C3B" />
      <text x="149" y="58" class="tag-txt" fill="#BC8CFF">Bluetooth 5.1 (LMP 10)</text>

      <rect x="284" y="44" width="115" height="20" rx="4" fill="#361214" />
      <text x="290" y="58" class="tag-txt" fill="#F85149">🔴 Conflict (Code 31)</text>

      <rect x="405" y="44" width="85" height="20" rx="4" fill="#1F3B2B" />
      <text x="411" y="58" class="tag-txt" fill="#3FB950">95/100 🏆</text>
    </g>

    <!-- Radio Card 2: Motherboard Card -->
    <g transform="translate(14, 122)">
      <rect x="0" y="0" width="502" height="74" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <text x="12" y="20" class="item-title">Realtek Bluetooth Adapter</text>
      <text x="12" y="34" class="item-sub">USB\VID_0BDA&amp;PID_4853\00E04C000001 (Internal M.2 Slot)</text>

      <!-- Tags -->
      <rect x="12" y="44" width="125" height="20" rx="4" fill="#161B22" />
      <text x="18" y="58" class="tag-txt" fill="#8B949E">Motherboard Internal</text>

      <rect x="143" y="44" width="135" height="20" rx="4" fill="#261C3B" />
      <text x="149" y="58" class="tag-txt" fill="#BC8CFF">Bluetooth 5.2 (LMP 11)</text>

      <rect x="284" y="44" width="105" height="20" rx="4" fill="#12261E" />
      <text x="290" y="58" class="tag-txt" fill="#3FB950">🟢 Active (Code 0)</text>

      <rect x="395" y="44" width="95" height="20" rx="4" fill="#161B22" />
      <text x="401" y="58" class="tag-txt" fill="#8B949E">85/100</text>
    </g>

    <!-- Column 2: Peripherals -->
    <g transform="translate(542, 0)">
      <rect x="0" y="0" width="370" height="210" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="16" y="24" class="card-hdr">🎧 Audio &amp; Peripherals</text>
      <text x="300" y="24" class="win-sub">2 found</text>

      <!-- Peripheral 1 -->
      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="342" height="42" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
        <text x="12" y="24" class="item-title">Haylou W1 (DEV_9C19C21B51AA)</text>
        <text x="260" y="24" class="tag-txt" fill="#3FB950">🟢 Connected</text>
      </g>

      <!-- Peripheral 2 -->
      <g transform="translate(14, 90)">
        <rect x="0" y="0" width="342" height="42" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
        <text x="12" y="24" class="item-title">AirPods Pro</text>
        <text x="260" y="24" class="tag-txt" fill="#8B949E">⚪ Paired (Standby)</text>
      </g>

      <!-- Audio Stack Note -->
      <g transform="translate(14, 144)">
        <rect x="0" y="0" width="342" height="52" rx="6" fill="#0D1117" stroke="#1F2937" stroke-width="1" />
        <text x="10" y="20" class="item-sub" fill="#38BDF8">Windows AudioEndpointBuilder &amp; BTAGService</text>
        <text x="10" y="36" class="item-sub" fill="#94A3B8">Will cycle automatically during fix to avoid reboot.</text>
      </g>
    </g>
  </g>

  <!-- Action Command Bar -->
  <g transform="translate(24, 396)">
    <rect x="0" y="0" width="912" height="46" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Primary Button: Auto-Fix -->
    <rect x="12" y="8" width="165" height="30" rx="6" fill="url(#primaryBtnGrad)" stroke="#3FB950" stroke-width="1" />
    <text x="26" y="27" class="btn-txt" fill="#FFFFFF">⚡ One-Click Auto-Fix</text>

    <!-- Button: Scan -->
    <rect x="187" y="8" width="130" height="30" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="201" y="27" class="btn-txt">🔍 Scan &amp; Benchmark</text>

    <!-- Button: Restart Audio -->
    <rect x="327" y="8" width="135" height="30" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="339" y="27" class="btn-txt">🎧 Fix Audio Drops</text>

    <!-- Button: Rollback -->
    <rect x="472" y="8" width="105" height="30" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="490" y="27" class="btn-txt">🔄 Rollback</text>

    <!-- Button: Export Report -->
    <rect x="587" y="8" width="125" height="30" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="600" y="27" class="btn-txt">📋 Export Report</text>
  </g>

  <!-- Live Console Log -->
  <g transform="translate(24, 452)">
    <rect x="0" y="0" width="912" height="92" rx="8" fill="#090D13" stroke="#30363D" stroke-width="1" />
    <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#8B949E">📜 LIVE ACTIVITY LOG</text>
    
    <text x="12" y="34" class="console-txt"><tspan fill="#6E7681">[03:15:20]</tspan> <tspan fill="#58A6FF" font-weight="700">[INFO]</tspan> Hardware scan discovered 2 Bluetooth radio(s) and 2 paired peripheral(s).</text>
    <text x="12" y="50" class="console-txt"><tspan fill="#6E7681">[03:15:20]</tspan> <tspan fill="#D29922" font-weight="700">[WARN]</tspan> Dual-radio conflict detected! USB Dongle is blocked in Code 31 (CM_PROB_FAILED_ADD).</text>
    <text x="12" y="66" class="console-txt"><tspan fill="#6E7681">[03:15:21]</tspan> <tspan fill="#3FB950" font-weight="700">[OK]</tspan> Superiority engine selected USB Dongle (Score: 95/100) due to external antenna clearance.</text>
    <text x="12" y="82" class="console-txt"><tspan fill="#6E7681">[03:15:21]</tspan> <tspan fill="#A371F7" font-weight="700">[ACTION]</tspan> Ready to repair. Click 'One-Click Auto-Fix' to apply changes and cycle audio stack.</text>
  </g>
</svg>
