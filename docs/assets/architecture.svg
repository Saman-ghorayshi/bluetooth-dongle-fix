<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E2E" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Winner Card Gradient -->
    <linearGradient id="winnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Engine Gradient -->
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399" />
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FBBF24" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 20px; fill: #FFFFFF; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #F1F5F9; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
    .mono { font-family: "JetBrains Mono", Consolas, "Fira Code", monospace; font-size: 11px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10px; }
    .engine-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 14px; fill: #C084FC; }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="960" height="520" rx="16" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="2" />

  <!-- Grid Accents -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="520" />
    <line x1="240" y1="0" x2="240" y2="520" />
    <line x1="480" y1="0" x2="480" y2="520" />
    <line x1="720" y1="0" x2="720" y2="520" />
    <line x1="880" y1="0" x2="880" y2="520" />
    <line x1="0" y1="130" x2="960" y2="130" />
    <line x1="0" y1="260" x2="960" y2="260" />
    <line x1="0" y1="390" x2="960" y2="390" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 26)">
    <circle cx="20" cy="20" r="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="13" y="26" font-size="16">🎧</text>
    <text x="50" y="20" class="title">BTFix Architecture &amp; Conflict Resolution Engine</text>
    <text x="50" y="38" class="subtitle">Dynamic Dual-Radio Arbitration • Superiority Benchmark Engine • Audio Endpoint Re-anchoring</text>
  </g>

  <!-- ==================== LEFT COLUMN: HARDWARE LAYER ==================== -->
  <g transform="translate(40, 85)">
    <text x="0" y="0" class="mono" fill="#38BDF8" font-weight="700">LAYER 1: HARDWARE DISCOVERY</text>

    <!-- Card 1: Internal Motherboard Radio -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="260" height="175" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
      <rect x="12" y="12" width="6" height="24" rx="3" fill="#FBBF24" />
      <text x="26" y="24" class="card-title">Realtek / Intel BT</text>
      <text x="26" y="38" class="card-desc">Motherboard Internal Card</text>

      <rect x="14" y="55" width="232" height="52" rx="6" fill="#0B0F19" stroke="#1F2937" stroke-width="1" />
      <text x="22" y="73" class="mono" fill="#94A3B8">• Bluetooth 5.2 (LMP 11)</text>
      <text x="22" y="89" class="mono" fill="#EF4444">• 2.4GHz Wi-Fi Coexistence Clash</text>
      <text x="22" y="103" class="mono" fill="#EF4444">• Metal Chassis Shielding (-15 pts)</text>

      <!-- Status Badge -->
      <rect x="14" y="122" width="160" height="26" rx="6" fill="#451A03" stroke="#FBBF24" stroke-width="1" />
      <text x="24" y="139" class="badge-text" fill="#FBBF24">🟡 PARKED (Code 22)</text>

      <text x="184" y="139" class="mono" fill="#94A3B8" font-weight="700">85/100</text>
    </g>

    <!-- Card 2: External USB Dongle -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="260" height="175" rx="10" fill="url(#winnerGrad)" stroke="#10B981" stroke-width="2" filter="url(#glowGreen)" />
      <rect x="12" y="12" width="6" height="24" rx="3" fill="#34D399" />
      <text x="26" y="24" class="card-title">Generic USB Dongle</text>
      <text x="26" y="38" class="card-desc">CSR / Realtek / Actions ATS2851</text>

      <rect x="14" y="55" width="232" height="52" rx="6" fill="#0B0F19" stroke="#1F2937" stroke-width="1" />
      <text x="22" y="73" class="mono" fill="#94A3B8">• Bluetooth 5.1 (LMP 10)</text>
      <text x="22" y="89" class="mono" fill="#34D399">• Dedicated External Antenna (+15)</text>
      <text x="22" y="103" class="mono" fill="#34D399">• Zero Wi-Fi Coexistence Stutter</text>

      <!-- Status Badge -->
      <rect x="14" y="122" width="160" height="26" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1" />
      <text x="24" y="139" class="badge-text" fill="#34D399">🟢 ACTIVE (Code 0)</text>

      <text x="184" y="139" class="mono" fill="#34D399" font-weight="700">95/100 🏆</text>
    </g>
  </g>

  <!-- ==================== MIDDLE COLUMN: THE ENGINE ==================== -->
  <g transform="translate(350, 115)">
    <text x="0" y="-30" class="mono" fill="#A855F7" font-weight="700">LAYER 2: SUPERIORITY ENGINE</text>

    <!-- Connecting Arrows from Hardware to Engine -->
    <path d="M -50 40 L 0 80" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowYellow)" fill="none" />
    <path d="M -50 240 L 0 170" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrowGreen)" fill="none" />

    <!-- Center Engine Box -->
    <rect x="0" y="20" width="250" height="280" rx="14" fill="url(#engineGrad)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glowBlue)" />
    
    <g transform="translate(18, 20)">
      <circle cx="16" cy="16" r="16" fill="#2E1065" stroke="#C084FC" stroke-width="1.5" />
      <text x="8" y="22" font-size="14">⚖️</text>
      <text x="42" y="16" class="engine-title">Superiority Engine</text>
      <text x="42" y="30" class="card-desc">Arbitration Matrix</text>

      <!-- Metric 1 -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="214" height="42" rx="6" fill="#090D16" stroke="#312E81" stroke-width="1" />
        <text x="10" y="18" class="mono" fill="#C084FC" font-weight="700">1. LMP Spec Scoring</text>
        <text x="10" y="32" class="card-desc">BT 5.1 (80 pts) vs BT 5.2 (85 pts)</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(0, 98)">
        <rect x="0" y="0" width="214" height="42" rx="6" fill="#090D16" stroke="#312E81" stroke-width="1" />
        <text x="10" y="18" class="mono" fill="#38BDF8" font-weight="700">2. RF Clear Antenna</text>
        <text x="10" y="32" class="card-desc">External Dongle Bonus: +15 pts</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(0, 148)">
        <rect x="0" y="0" width="214" height="42" rx="6" fill="#090D16" stroke="#312E81" stroke-width="1" />
        <text x="10" y="18" class="mono" fill="#34D399" font-weight="700">3. Desktop Enclosure</text>
        <text x="10" y="32" class="card-desc">Tower Chassis Clearance: +5 pts</text>
      </g>

      <!-- Result Banner -->
      <g transform="translate(0, 200)">
        <rect x="0" y="0" width="214" height="34" rx="6" fill="#14532D" stroke="#22C55E" stroke-width="1.5" />
        <text x="16" y="22" class="badge-text" fill="#FFFFFF">AUTO-SELECTED: DONGLE (95 pts)</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: AUDIO & PERIPHERALS ==================== -->
  <g transform="translate(660, 85)">
    <text x="0" y="0" class="mono" fill="#34D399" font-weight="700">LAYER 3: AUDIO &amp; PERIPHERALS</text>

    <!-- Arrow from Engine to Audio Layer -->
    <path d="M -60 170 L 0 100" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowBlue)" fill="none" />

    <!-- Card 1: Windows Audio Pipeline -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="260" height="175" rx="10" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="1.5" />
      <rect x="12" y="12" width="6" height="24" rx="3" fill="#38BDF8" />
      <text x="26" y="24" class="card-title">Windows Audio Stack</text>
      <text x="26" y="38" class="card-desc">Endpoint Resynchronization</text>

      <rect x="14" y="55" width="232" height="52" rx="6" fill="#0B0F19" stroke="#1F2937" stroke-width="1" />
      <text x="22" y="73" class="mono" fill="#38BDF8">• BTAGService Cycled</text>
      <text x="22" y="89" class="mono" fill="#38BDF8">• AudioEndpointBuilder Flushed</text>
      <text x="22" y="103" class="mono" fill="#34D399">• Zero Reboot Required</text>

      <!-- Status Badge -->
      <rect x="14" y="122" width="232" height="26" rx="6" fill="#082F49" stroke="#38BDF8" stroke-width="1" />
      <text x="24" y="139" class="badge-text" fill="#38BDF8">OUTPUT TOPOLOGY REBUILT ✓</text>
    </g>

    <!-- Card 2: Paired Earbuds & Peripherals -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="260" height="175" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" />
      <rect x="12" y="12" width="6" height="24" rx="3" fill="#34D399" />
      <text x="26" y="24" class="card-title">True Wireless Audio</text>
      <text x="26" y="38" class="card-desc">Haylou W1 • AirPods • Galaxy Buds</text>

      <rect x="14" y="55" width="232" height="52" rx="6" fill="#0B0F19" stroke="#1F2937" stroke-width="1" />
      <text x="22" y="73" class="mono" fill="#34D399">• Stereo A2DP Sink Locked</text>
      <text x="22" y="89" class="mono" fill="#34D399">• 0ms Stutter / Zero Cutouts</text>
      <text x="22" y="103" class="mono" fill="#34D399">• Full Transmission Range (10m+)</text>

      <!-- Status Badge -->
      <rect x="14" y="122" width="232" height="26" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1" />
      <text x="24" y="139" class="badge-text" fill="#34D399">🟢 PRISTINE AUDIO STREAMING</text>
    </g>
  </g>

  <!-- ==================== FOOTER SAFEGUARDS ==================== -->
  <g transform="translate(40, 485)">
    <text x="0" y="0" class="mono" fill="#64748B" font-size="10">🛡️ 100% REVERSIBLE SNAPSHOTS (%LOCALAPPDATA%\BTFix)</text>
    <text x="360" y="0" class="mono" fill="#64748B" font-size="10">⚡ ZERO THIRD-PARTY DEPENDENCIES</text>
    <text x="640" y="0" class="mono" fill="#64748B" font-size="10">🔒 STRICT BLUETOOTH CLASS PNP GUARD</text>
  </g>
</svg>
