name: Release

# Tagged releases: run the suite, package a zip with the integrity manifest,
# and publish both plus SHA256SUMS.txt as release artifacts.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Test, package, publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        shell: powershell
        run: .\tests\run-tests.ps1

      - name: Package release
        shell: powershell
        run: .\.github\scripts\package-release.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Publish GitHub Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "BTFix-$tag.zip" "SHA256SUMS.txt" --title "BTFix $tag" --generate-notes
